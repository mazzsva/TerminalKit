name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcode:
    name: Xcode
    uses: mazzsva/.github/.github/workflows/xcode.yml@v1.0.0
    with:
      scheme: TerminalKit
      platform: macOS
      lint-paths: Package.swift Sources Tests Example
      example-project: Example/TerminalKitExample.xcodeproj
      example-scheme: TerminalKitExample
